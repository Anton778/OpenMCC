[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    jgromes/RadioLib@7.7.1
build_flags =
    -D CORE_DEBUG_LEVEL=0
build_src_filter =
    +<main_v8.cpp>
    -<main.cpp>
    -<main_fixed.cpp>
    -<main_v7.cpp>
