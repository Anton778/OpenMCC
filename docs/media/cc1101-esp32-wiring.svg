<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="860" viewBox="0 0 1320 860" role="img" aria-labelledby="title desc">
  <title id="title">Подключение радиомодуля CC1101 к ESP32-WROOM-32</title>
  <desc id="desc">Векторная схема соединений VCC, GND, SCK, MISO, MOSI, CSN, GDO0 и GDO2 между CC1101 и ESP32-WROOM-32.</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
    <style>
      .font { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .title { font-size: 32px; font-weight: 750; fill: #0f172a; }
      .subtitle { font-size: 17px; font-weight: 500; fill: #475569; }
      .board-title { font-size: 24px; font-weight: 750; fill: #ffffff; }
      .board-subtitle { font-size: 15px; font-weight: 500; fill: #cbd5e1; }
      .pin { font-size: 18px; font-weight: 700; fill: #ffffff; }
      .pin-note { font-size: 13px; font-weight: 500; fill: #cbd5e1; }
      .wire-label { font-size: 14px; font-weight: 700; fill: #0f172a; }
      .notice { font-size: 17px; font-weight: 700; fill: #991b1b; }
      .footnote { font-size: 14px; font-weight: 500; fill: #475569; }
      .wire { fill: none; stroke-width: 5; stroke-linecap: round; }
      .terminal { stroke: #ffffff; stroke-width: 3; }
    </style>
  </defs>

  <rect width="1320" height="860" fill="#f8fafc"/>
  <rect x="1" y="1" width="1318" height="858" rx="24" fill="none" stroke="#dbe4ee" stroke-width="2"/>

  <g class="font">
    <text x="660" y="52" text-anchor="middle" class="title">Подключение CC1101 к ESP32-WROOM-32</text>
    <text x="660" y="82" text-anchor="middle" class="subtitle">Интерфейс SPI и линии состояния GDO0/GDO2</text>

    <!-- ESP32 board -->
    <g filter="url(#shadow)">
      <rect x="60" y="120" width="370" height="650" rx="24" fill="#16324f"/>
      <rect x="80" y="140" width="330" height="84" rx="14" fill="#0f253b" stroke="#315b7d" stroke-width="2"/>
      <rect x="164" y="155" width="162" height="48" rx="6" fill="#d7dde4"/>
      <path d="M178 170h134v19H178z" fill="#b8c2cc"/>
      <path d="M192 162v34M211 162v34M230 162v34M249 162v34M268 162v34M287 162v34" stroke="#8b99a8" stroke-width="2"/>
      <text x="245" y="252" text-anchor="middle" class="board-title">ESP32-WROOM-32</text>
      <text x="245" y="277" text-anchor="middle" class="board-subtitle">радиошлюз ЦУПа · логика 3,3 В</text>
    </g>

    <!-- CC1101 board -->
    <g filter="url(#shadow)">
      <rect x="890" y="120" width="370" height="650" rx="24" fill="#0f766e"/>
      <rect x="1044" y="139" width="62" height="58" rx="8" fill="#d9b453" stroke="#fff4bd" stroke-width="3"/>
      <rect x="1055" y="122" width="40" height="24" rx="5" fill="#cbd5e1" stroke="#8795a4" stroke-width="2"/>
      <circle cx="1075" cy="168" r="11" fill="#f8fafc" stroke="#9b7a2c" stroke-width="3"/>
      <path d="M1075 197v30" stroke="#d9b453" stroke-width="5"/>
      <text x="1075" y="252" text-anchor="middle" class="board-title">CC1101</text>
      <text x="1075" y="277" text-anchor="middle" class="board-subtitle">радиомодуль · питание 3,3 В</text>
    </g>

    <!-- Wires -->
    <path d="M430 330H890" class="wire" stroke="#e11d48"/>
    <path d="M430 390H890" class="wire" stroke="#334155"/>
    <path d="M430 450H890" class="wire" stroke="#ea580c"/>
    <path d="M430 510H890" class="wire" stroke="#2563eb"/>
    <path d="M430 570H890" class="wire" stroke="#7c3aed"/>
    <path d="M430 630H890" class="wire" stroke="#ca8a04"/>
    <path d="M430 690H890" class="wire" stroke="#16a34a"/>
    <path d="M430 750H890" class="wire" stroke="#0891b2"/>

    <!-- ESP32 pin labels -->
    <g>
      <text x="395" y="326" text-anchor="end" class="pin">3V3</text><text x="395" y="345" text-anchor="end" class="pin-note">питание</text>
      <text x="395" y="386" text-anchor="end" class="pin">GND</text><text x="395" y="405" text-anchor="end" class="pin-note">общий</text>
      <text x="395" y="446" text-anchor="end" class="pin">GPIO18</text><text x="395" y="465" text-anchor="end" class="pin-note">D18</text>
      <text x="395" y="506" text-anchor="end" class="pin">GPIO19</text><text x="395" y="525" text-anchor="end" class="pin-note">D19</text>
      <text x="395" y="566" text-anchor="end" class="pin">GPIO23</text><text x="395" y="585" text-anchor="end" class="pin-note">D23</text>
      <text x="395" y="626" text-anchor="end" class="pin">GPIO21</text><text x="395" y="645" text-anchor="end" class="pin-note">D21</text>
      <text x="395" y="686" text-anchor="end" class="pin">GPIO4</text><text x="395" y="705" text-anchor="end" class="pin-note">D4</text>
      <text x="395" y="746" text-anchor="end" class="pin">GPIO27</text><text x="395" y="765" text-anchor="end" class="pin-note">D27</text>
    </g>

    <!-- CC1101 pin labels -->
    <g>
      <text x="925" y="326" class="pin">VCC</text><text x="925" y="345" class="pin-note">3,3 В</text>
      <text x="925" y="386" class="pin">GND</text><text x="925" y="405" class="pin-note">общий</text>
      <text x="925" y="446" class="pin">SCK</text><text x="925" y="465" class="pin-note">тактовая SPI</text>
      <text x="925" y="506" class="pin">MISO / SO</text><text x="925" y="525" class="pin-note">CC1101 → ESP32</text>
      <text x="925" y="566" class="pin">MOSI / SI</text><text x="925" y="585" class="pin-note">ESP32 → CC1101</text>
      <text x="925" y="626" class="pin">CSN / CS</text><text x="925" y="645" class="pin-note">выбор микросхемы</text>
      <text x="925" y="686" class="pin">GDO0</text><text x="925" y="705" class="pin-note">линия состояния</text>
      <text x="925" y="746" class="pin">GDO2</text><text x="925" y="765" class="pin-note">линия состояния</text>
    </g>

    <!-- Terminals -->
    <g>
      <circle cx="430" cy="330" r="8" fill="#e11d48" class="terminal"/><circle cx="890" cy="330" r="8" fill="#e11d48" class="terminal"/>
      <circle cx="430" cy="390" r="8" fill="#334155" class="terminal"/><circle cx="890" cy="390" r="8" fill="#334155" class="terminal"/>
      <circle cx="430" cy="450" r="8" fill="#ea580c" class="terminal"/><circle cx="890" cy="450" r="8" fill="#ea580c" class="terminal"/>
      <circle cx="430" cy="510" r="8" fill="#2563eb" class="terminal"/><circle cx="890" cy="510" r="8" fill="#2563eb" class="terminal"/>
      <circle cx="430" cy="570" r="8" fill="#7c3aed" class="terminal"/><circle cx="890" cy="570" r="8" fill="#7c3aed" class="terminal"/>
      <circle cx="430" cy="630" r="8" fill="#ca8a04" class="terminal"/><circle cx="890" cy="630" r="8" fill="#ca8a04" class="terminal"/>
      <circle cx="430" cy="690" r="8" fill="#16a34a" class="terminal"/><circle cx="890" cy="690" r="8" fill="#16a34a" class="terminal"/>
      <circle cx="430" cy="750" r="8" fill="#0891b2" class="terminal"/><circle cx="890" cy="750" r="8" fill="#0891b2" class="terminal"/>
    </g>

    <!-- Signal labels -->
    <g>
      <rect x="575" y="313" width="170" height="34" rx="17" fill="#ffffff" stroke="#fecdd3" stroke-width="2"/><text x="660" y="335" text-anchor="middle" class="wire-label">ПИТАНИЕ 3,3 В</text>
      <rect x="601" y="373" width="118" height="34" rx="17" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="660" y="395" text-anchor="middle" class="wire-label">ОБЩИЙ</text>
      <rect x="607" y="433" width="106" height="34" rx="17" fill="#ffffff" stroke="#fed7aa" stroke-width="2"/><text x="660" y="455" text-anchor="middle" class="wire-label">SPI SCK</text>
      <rect x="599" y="493" width="122" height="34" rx="17" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/><text x="660" y="515" text-anchor="middle" class="wire-label">SPI MISO</text>
      <rect x="597" y="553" width="126" height="34" rx="17" fill="#ffffff" stroke="#ddd6fe" stroke-width="2"/><text x="660" y="575" text-anchor="middle" class="wire-label">SPI MOSI</text>
      <rect x="607" y="613" width="106" height="34" rx="17" fill="#ffffff" stroke="#fde68a" stroke-width="2"/><text x="660" y="635" text-anchor="middle" class="wire-label">SPI CS</text>
      <rect x="610" y="673" width="100" height="34" rx="17" fill="#ffffff" stroke="#bbf7d0" stroke-width="2"/><text x="660" y="695" text-anchor="middle" class="wire-label">GDO0</text>
      <rect x="610" y="733" width="100" height="34" rx="17" fill="#ffffff" stroke="#a5f3fc" stroke-width="2"/><text x="660" y="755" text-anchor="middle" class="wire-label">GDO2</text>
    </g>

    <g transform="translate(60 798)">
      <rect width="1200" height="40" rx="12" fill="#fff1f2" stroke="#fecdd3" stroke-width="2"/>
      <circle cx="23" cy="20" r="10" fill="#e11d48"/>
      <text x="23" y="25" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">!</text>
      <text x="44" y="25" class="notice">CC1101 подключать только к 3,3 В. Расположение контактов сверять по маркировке конкретного модуля.</text>
    </g>
  </g>
</svg>
