name: Windows installer

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install desktop build dependencies
        run: npm install --no-audit --no-fund

      - name: Build Windows installer
        run: npm run dist:win

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenMCC-Windows-Installer
          path: |
            release/*.exe
            release/*.yml
            release/*.blockmap
          if-no-files-found: error
          retention-days: 30

      - name: Read application version
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        id: app_version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub Release when this version is new
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.app_version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.app_version.outputs.version }}
        run: |
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $env:RELEASE_TAG already exists. Installer artifact was built, but the published release was not replaced."
            exit 0
          }

          $installer = Get-ChildItem -Path release -Filter "OpenMCC-Setup-*.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "Windows installer was not found in release/."
          }

          gh release create $env:RELEASE_TAG $installer.FullName `
            --target $env:GITHUB_SHA `
            --title "OpenMCC $env:RELEASE_TAG" `
            --generate-notes `
            --latest
